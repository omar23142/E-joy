<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Joy Translator</title>
  <meta charset="UTF-8">
  <title>E-Joy Translate</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      width: 300px;
      padding: 20px;
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .info-box {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 15px;
      border: 1px solid #eee;
    }

    h2 {
      color: #e67e22;
      margin-top: 0;
    }

    p {
      color: #666;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <div class="info-box">
    <h2>eJOY Ready!</h2>
    <p>The extension is active. Just hover over or click any word in the video subtitles to translate and save.</p>
    <p style="font-size: 12px; color: #999;">Login/Logout is now integrated directly in the video popup.</p>
  </div>
</body>

</html>
